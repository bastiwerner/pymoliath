[project]
name = "pymoliath"
version = "3.0.0"
description = "Type-safe, Rust- and Haskell-style monads for Python: Result, Either, Option, Maybe, Try, IO, Reader, Writer, State and their async counterparts."
authors = [{ name = "Bastian Werner", email = "bastian-werner@outlook.com" }]
requires-python = ">=3.12,<4.0"
dependencies = [
    # TypeVar defaults (PEP 696) for the `Never`-defaulted phantom types, before Python 3.13.
    "typing_extensions>=4.12",
]

[dependency-groups]
dev = [
    "pytest",
    "pyright",
    "ruff",
    "pdoc>=16.0.0",
    "mypy>=2.4.0",
    "pyperf>=2.10.0",
]

[tool.mypy]
strict = true
files = ["pymoliath"]
follow_imports = "silent"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# E4, E7, E9, F: ruff's own default rule set (pyflakes + pycodestyle errors).
select = ["E4", "E7", "E9", "F"]
# E731: lambda-assignment. This library is written in an FP style where
# `f = lambda x: ...` local aliases are idiomatic throughout, not a smell.
ignore = ["E731"]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.16,<0.13"]
build-backend = "uv_build"
