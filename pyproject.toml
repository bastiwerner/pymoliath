[project]
name = "pymoliath"
version = "2.0.0"
description = ""
authors = [{ name = "Bastian Werner", email = "bastian-werner@outlook.com" }]
requires-python = ">=3.12,<4.0"
dependencies = [
    # TypeVar defaults (PEP 696) for the `Never`-defaulted phantom types, before Python 3.13.
    "typing_extensions>=4.12",
]

[dependency-groups]
dev = [
    "pytest",
    "pyright",
    "ruff",
    "pdoc>=16.0.0",
    "mypy>=2.4.0",
    "pyperf>=2.10.0",
]

[tool.mypy]
strict = true
# The sum types, their async wrappers and the helpers they use. Reader/State/IO/Lazy/Writer are not
# mypy-clean yet (pyright covers the whole package).
files = [
    "pymoliath/result.py",
    "pymoliath/either.py",
    "pymoliath/option.py",
    "pymoliath/maybe.py",
    "pymoliath/exception.py",
    "pymoliath/errors.py",
    "pymoliath/util.py",
    "pymoliath/aio/async_result.py",
    "pymoliath/aio/async_either.py",
    "pymoliath/aio/async_option.py",
    "pymoliath/aio/async_maybe.py",
    "pymoliath/aio/async_try.py",
]
follow_imports = "silent"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# E4, E7, E9, F: ruff's own default rule set (pyflakes + pycodestyle errors).
select = ["E4", "E7", "E9", "F"]
# E731: lambda-assignment. This library is written in an FP style where
# `f = lambda x: ...` local aliases are idiomatic throughout, not a smell.
ignore = ["E731"]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.16,<0.13"]
build-backend = "uv_build"
